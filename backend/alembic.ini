[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# NOTE: keep this file ASCII-only; configparser reads it with the system code
# page (GBK on Windows), so non-ASCII comments break `alembic` and `run_migrations`.
#
# The real connection string comes from alembic/env.py
# (programmatic override first, then app settings.database_url).
sqlalchemy.url = sqlite:///./data/resume_match.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
